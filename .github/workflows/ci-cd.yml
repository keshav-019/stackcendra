# CI/CD for the self-hosted deployment on the VM (Vercel deploys the same
# code to stackcendra.com on its own; this workflow does not touch Vercel).
#
#   pull request -> lint, typecheck, unit + API tests (Postgres service),
#                   Playwright E2E against a production build, image build
#                   (not pushed)
#   push to main -> the same, push the image to GHCR, deploy it to the VM
#
# The deploy job SSHes into the VM with a dedicated deploy key, copies
# deploy/ and db/migrations to ~/stackcendra there, and runs
# deploy/scripts/deploy.sh (backup, migrations, container swap, health
# check, automatic rollback). See deploy/README.md.
#
# Secrets (environment "vm-production"): VM_HOST, VM_USER, VM_SSH_KEY,
# VM_KNOWN_HOSTS. The registry login uses the job's own GITHUB_TOKEN.
name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/keshav-019/stackcendra-web

jobs:
  check:
    name: Lint, unit/API tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stackcendra
          POSTGRES_DB: stackcendra_test
          # Throwaway database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackcendra -d stackcendra_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://stackcendra@localhost:5432/stackcendra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Unit and component tests
        run: npm test
      - name: API tests (route handlers against Postgres)
        run: npm run test:api
      - run: npm run build
      - name: Lint deploy scripts
        run: shellcheck --severity=warning deploy/scripts/*.sh

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stackcendra
          POSTGRES_DB: stackcendra_test
          # Throwaway database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackcendra -d stackcendra_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://stackcendra@localhost:5432/stackcendra_test
    steps:
      # Fresh throwaway secrets for this job's server; the E2E session
      # cookies are signed with the same AUTH_SECRET.
      - name: Generate test secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Build image
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vm-production
      url: http://vanisher.projectyourown.com:8080/api/health
    # One deploy at a time; a newer push waits instead of cancelling a
    # deploy halfway through.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User $VM_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ConnectTimeout 20
          EOF

      # deploy/.env lives only on the VM and is not in git, so this never
      # overwrites it. Migrations ship inside the image, not here.
      - name: Copy deploy files to the VM
        run: tar -czf - deploy | ssh vm "mkdir -p ~/stackcendra && tar -xzf - -C ~/stackcendra"

      - name: Log the VM in to GHCR (this job only)
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh vm "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        run: ssh vm "stackcendra/deploy/scripts/deploy.sh ${{ env.IMAGE }}:${{ github.sha }}"

      - name: Log the VM out of GHCR
        if: always()
        run: ssh vm "docker logout ghcr.io" || true

      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "http://${{ secrets.VM_HOST }}:8080/api/health"
