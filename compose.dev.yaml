# Local Postgres for development and tests (matches production's major
# version). Not used on the VM -- see deploy/ for that.
#
#   docker compose -f compose.dev.yaml up -d
#   npm run db:migrate          # dev database
#
# Creates two databases: stackcendra_dev (npm run dev) and stackcendra_test
# (API tests and Playwright), both owned by the `stackcendra` role.
name: stackcendra-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: stackcendra-dev-pg
    environment:
      POSTGRES_USER: stackcendra
      POSTGRES_PASSWORD: stackcendra
      POSTGRES_DB: stackcendra_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackcendra -d stackcendra_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
